<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – AITA Grading System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="container">
    <div class="card" id="login-card">
      <h1 class="title">AITA Grading System</h1>
      <p class="subtitle">Sign in to view your grades</p>

      <!-- Step 1: Google Sign‑In -->
      <div id="google-section" class="step-section">
        <div id="g_id_onload"
             data-client_id="YOUR_GOOGLE_CLIENT_ID"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="onGoogleSignIn"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_blue" data-text="signin_with" data-shape="rectangular" data-logo_alignment="left"></div>
      </div>

      <!-- Step 2: Password -->
      <div id="password-section" class="step-section hidden">
        <label for="email" class="field-label">Email</label>
        <input type="email" id="email" class="input-field" readonly />
        <label for="password" class="field-label">Password</label>
        <input type="password" id="password" class="input-field" placeholder="Enter your password" />
        <button class="primary-btn" id="password-next">Next</button>
      </div>

      <!-- Step 3: OTP -->
      <div id="otp-section" class="step-section hidden">
        <label for="otp" class="field-label">One‑Time Password</label>
        <input type="text" id="otp" class="input-field" placeholder="6‑digit code" maxlength="6" />
        <button class="primary-btn" id="otp-submit">Sign In</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
