# nginx configuration for the deployed frontend.
#
# Two things matter here beyond serving static files:
#   1. A single-page app must fall back to index.html for unknown paths, otherwise a refresh
#      on /dashboard returns 404.
#   2. The Socket.IO connection has to be proxied so the browser can reach the gateway without
#      a cross-origin request. Without the upgrade headers, real-time grading silently falls
#      back to polling — or fails outright.
#
# The upstream host is held in a variable rather than written inline. With a literal hostname
# nginx resolves it at STARTUP and refuses to boot if the name is not resolvable:
#     [emerg] host not found in upstream "api-gateway"
# That makes the image impossible to smoke-test on its own and couples container start order to
# DNS. Using a variable defers resolution to request time, so the container always starts and a
# temporarily missing gateway surfaces as a 502 on /api/ instead of a dead web server.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolver for the deferred upstream lookups below. 127.0.0.11 is Docker's embedded DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Compress text assets; the bundle is large and this is free throughput.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable, so cache them aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Real-time grading stream. `Upgrade`/`Connection` are required for the WebSocket
    # transport; the long read timeout keeps an idle socket alive during a slow grading run.
    location /socket.io/ {
        set $gateway_host api-gateway:3000;
        proxy_pass http://$gateway_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # API traffic goes to the gateway under the same origin, so the browser never issues a
    # cross-origin request and no CORS pre-flight is needed in production.
    location /api/ {
        set $gateway_host api-gateway:3000;
        proxy_pass http://$gateway_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads are capped at 10 MB by the gateway; allow headroom for multipart framing.
        client_max_body_size 20m;
        proxy_read_timeout 120s;
    }

    # SPA fallback — must come last so it does not shadow the rules above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
