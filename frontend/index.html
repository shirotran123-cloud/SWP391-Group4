<!doctype html>
<!-- lang must be "vi": it tells the browser and screen readers the document is Vietnamese,
     and it stops some locales from guessing the encoding wrongly. -->
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="description" content="AITA-Intelligent — Nền tảng chấm bài tự động và phân tích mã nguồn bằng trí tuệ nhân tạo (SWP391 Nhóm 4)" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AITA-Intelligent — Chấm bài tự động &amp; Phân tích mã nguồn</title>

  <!--
    Google Identity Services. This is what makes sign-in work on any port: it renders the
    account chooser in a popup and hands the page a signed ID token, so no `redirect_uri`
    has to be registered and `redirect_uri_mismatch` cannot happen. The legacy
    `response_type=token id_token` redirect flow below is kept only as a fallback.
  -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
