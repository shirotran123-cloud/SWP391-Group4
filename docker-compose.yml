services:
  postgres:
    image: postgres:15-alpine
    container_name: aita-postgres
    restart: always
    environment:
      POSTGRES_USER: aita_admin
      POSTGRES_PASSWORD: aita_secret_password
      POSTGRES_DB: aita_autograding
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init_all_13_tables.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aita_admin -d aita_autograding"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aita-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
