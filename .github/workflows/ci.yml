name: AITA Continuous Integration & Quality Gate

on:
  push:
    branches: [ main, develop, 'feature/**', trung ]
  pull_request:
    branches: [ main, develop ]

# Milestone 3 requires linting to pass and unit-test coverage of at least 80% on the core
# backend and frontend modules. Every job below therefore runs the real measured gate rather
# than a smoke test: c8 enforces the thresholds for the Node services and Vitest enforces them
# for the frontend. A build that drops below the bar fails here instead of being discovered
# during the defence.

jobs:
  commit-lint:
    name: 🛡️ Conventional Commits Verification (Git Analytics)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Commitlint
        run: |
          npm install --no-save @commitlint/cli @commitlint/config-conventional

      - name: Verify PR Commits Format
        if: github.event_name == 'pull_request'
        run: |
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  gateway-quality-gate:
    name: ⚡ API Gateway — typecheck, lint & coverage ≥ 80%
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api-gateway/package.json

      - name: Start Redis Service Container
        uses: supercharge/redis-github-action@1.8.0
        with:
          redis-version: 7-alpine

      - name: Install Dependencies
        working-directory: api-gateway
        run: npm ci || npm install

      - name: TypeScript Static Typecheck
        working-directory: api-gateway
        run: npx tsc --noEmit

      - name: Build Production Gateway Bundle
        working-directory: api-gateway
        run: npm run build

      # Runs every suite (cover-gates, demo-real, cover-80, goal gates, test-cases and the
      # Milestone 3 suite) in one process so c8 reports a single honest number.
      - name: Unit Test Suite with Coverage Gate (≥ 80%)
        working-directory: api-gateway
        env:
          AITA_TEST_PORT: '3111'
        run: npm run test:coverage

  genai-hub-quality-gate:
    name: 🧠 GenAI Hub — typecheck & coverage ≥ 80%
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: genai-hub/package.json

      - name: Install Dependencies
        working-directory: genai-hub
        run: npm ci || npm install

      - name: TypeScript Static Typecheck
        working-directory: genai-hub
        run: npx tsc --noEmit

      - name: Unit Test Suite with Coverage Gate (≥ 80%)
        working-directory: genai-hub
        run: |
          npx c8 --reporter=text --reporter=text-summary \
            --check-coverage --lines 80 --functions 80 --statements 80 \
            --include='src/**/*.ts' \
            npx ts-node --transpile-only test/run-coverage-all.ts

  frontend-quality-gate:
    name: 💻 Frontend React 19 — lint, build & coverage ≥ 80%
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Lint (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Vite Production Build
        working-directory: frontend
        run: npm run build

      # `npm run build` runs `tsc -b`, which deliberately excludes the test files so a
      # test-only type error cannot break the deployable bundle. That means the suites need
      # their own typecheck, or they would drift out of type-safety unnoticed.
      - name: Typecheck the Test Suites
        working-directory: frontend
        run: npx tsc -p tsconfig.test.json

      # Vitest enforces the thresholds declared in vitest.config.ts, so this step fails the
      # build the moment coverage drops below the Milestone 3 requirement.
      - name: Unit Test Suite with Coverage Gate (≥ 80%)
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload Frontend Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  docker-build-gate:
    name: 🐳 Production images build on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      # Building the images is itself a regression test. Two defects shipped here that local
      # Windows development could never reveal: a hard dependency on
      # `@rolldown/binding-win32-x64-msvc` (npm refuses to install it on Linux with
      # EBADPLATFORM), and an undeclared `react-is` peer that only resolved on the developer's
      # machine because npm happened to hoist it. Both broke the Linux build outright.
      - name: Build API Gateway image
        run: docker build -t aita-api-gateway:ci ./api-gateway

      - name: Build GenAI Hub image
        run: docker build -t aita-genai-hub:ci ./genai-hub

      - name: Build Frontend image
        run: docker build -t aita-frontend:ci ./frontend

      # A crash-looping entry point (wrong `dist/` path for the compiled server) is invisible
      # until the container is actually started, so smoke-test each one.
      - name: Smoke-test the Gateway image
        run: |
          docker run -d --name gw-ci -p 3000:3000 \
            -e REDIS_HOST=host.docker.internal -e POSTGRES_HOST=host.docker.internal \
            aita-api-gateway:ci
          sleep 12
          docker logs gw-ci | tail -20
          # It must not have exited; a missing entry point shows up as a restart loop.
          test "$(docker inspect -f '{{.State.Running}}' gw-ci)" = "true"
          docker rm -f gw-ci

      - name: Smoke-test the GenAI Hub image
        run: |
          docker run -d --name hub-ci -p 3001:3001 aita-genai-hub:ci
          sleep 12
          docker logs hub-ci | tail -20
          test "$(docker inspect -f '{{.State.Running}}' hub-ci)" = "true"
          curl -fsS http://localhost:3001/health
          docker rm -f hub-ci

      - name: Validate the production compose file
        run: docker compose -f docker-compose.prod.yml config --quiet
