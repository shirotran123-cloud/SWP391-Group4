name: AITA Continuous Integration & Quality Gate

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  commit-lint:
    name: 🛡️ Conventional Commits Verification (Git Analytics)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Commitlint
        run: |
          npm install --no-save @commitlint/cli @commitlint/config-conventional

      - name: Verify PR Commits Format
        if: github.event_name == 'pull_request'
        run: |
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  build-and-test-gateway:
    name: ⚡ NestJS API Gateway & Queue Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api-gateway/package.json

      - name: Start Redis Service Container
        uses: supercharge/redis-github-action@1.8.0
        with:
          redis-version: 7-alpine

      - name: Install Dependencies
        working-directory: api-gateway
        run: npm ci || npm install

      - name: TypeScript Static Typecheck
        working-directory: api-gateway
        run: npx tsc --noEmit

      - name: Build Production Gateway Bundle
        working-directory: api-gateway
        run: npm run build

      - name: Run Gateway Automated Test Suite (<200ms & Socket.IO Stream)
        working-directory: api-gateway
        run: |
          node dist/src/main.js &
          sleep 3
          npx ts-node test/verify-gateway.ts

  build-frontend:
    name: 💻 Frontend React 19 + Vite Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Vite Production Build
        working-directory: frontend
        run: npm run build
